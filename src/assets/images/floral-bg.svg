<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200' viewBox='0 0 200 200'>
  <rect width='200' height='200' fill='#ffffff'/>
  
  <defs>
    <g id="rose">
      <path d="M0,0 C-2,-5 2,-5 5,-2 C8,1 8,5 5,8 C2,11 -2,11 -5,8 C-8,5 -8,1 -5,-2 Z" fill="#ffb7c5" />
      <path d="M0,0 C-1,-2 1,-2 2,-1 C3,0 3,2 2,3 C1,4 -1,4 -2,3 C-3,2 -3,0 -2,-1 Z" fill="#ff8da1" transform="translate(1, 1)"/>
    </g>
    <g id="bunch">
      <use href="#rose" x="0" y="0" transform="scale(1.2)"/>
      <use href="#rose" x="8" y="5" transform="rotate(45) scale(0.9)"/>
      <use href="#rose" x="-6" y="6" transform="rotate(-30) scale(1.0)"/>
      <path d="M-5,5 Q-10,10 -15,5 Q-10,0 -5,5 Z" fill="#88aa88" />
      <path d="M5,10 Q10,15 15,10 Q10,5 5,10 Z" fill="#88aa88" />
      <path d="M0,-5 Q5,-10 0,-15 Q-5,-10 0,-5 Z" fill="#88aa88" />
    </g>
    <g id="small-rose">
       <circle cx="0" cy="0" r="4" fill="#ffb7c5"/>
       <circle cx="0" cy="0" r="2" fill="#ff8da1"/>
       <path d="M2,2 Q4,4 6,2 Q4,0 2,2 Z" fill="#88aa88"/>
       <path d="M-2,2 Q-4,4 -6,2 Q-4,0 -2,2 Z" fill="#88aa88"/>
    </g>
  </defs>

  <!-- Scattered Bunches -->
  <use href="#bunch" x="40" y="40" />
  <use href="#bunch" x="140" y="140" />
  <use href="#bunch" x="160" y="40" transform="rotate(90 160 40)"/>
  <use href="#bunch" x="50" y="150" transform="rotate(-45 50 150)"/>
  <use href="#bunch" x="100" y="90" transform="scale(1.1)"/>

  <!-- Scattered Small Roses -->
  <use href="#small-rose" x="80" y="30" />
  <use href="#small-rose" x="20" y="90" />
  <use href="#small-rose" x="180" y="80" />
  <use href="#small-rose" x="120" y="20" />
  <use href="#small-rose" x="100" y="180" />
  <use href="#small-rose" x="10" y="180" />
  <use href="#small-rose" x="180" y="180" />
  
  <!-- Tiny Filler Leaves -->
  <circle cx="60" cy="70" r="1" fill="#88aa88"/>
  <circle cx="120" cy="120" r="1.5" fill="#88aa88"/>
  <circle cx="150" cy="60" r="1" fill="#88aa88"/>
  <circle cx="30" cy="130" r="1.5" fill="#88aa88"/>

</svg>
